; Catppuccin color schemes for Catppuccinify
; Four official flavors: Mocha (default, darkest), Macchiato, Frappé, Latte (lightest).
; Switch with: spicetify config color_scheme <mocha|macchiato|frappe|latte>
; Or switch dynamically inside Spotify via the Settings dropdown!
;
; Keys map to Spotify's UI roles:
; text / subtext      = foreground text
; main                = app background (base)
; sidebar / player    = navigation + player surfaces (mantle)
; card                = elevated card surface (surface 0/1)
; shadow              = deepest surface (crust)
; highlight           = hover overlay
; selected-row        = selected list rows
; button / tab-active = accent surfaces (mauve)
; button-active       = accent pressed state
; button-disabled     = disabled controls + track scrubber
; notification        = toast / notification accent
; notification-error  = error toast accent
; equalizer           = animated player equalizer accent
; misc                = misc UI details
; + full Catppuccin palette tokens (rosewater, mauve, base, mantle, etc.)

