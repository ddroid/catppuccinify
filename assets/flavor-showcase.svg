<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#11111B"/>

  <!-- Title & Subtitle -->
  <text x="600.0" y="56" fill="#CDD6F4" font-family="system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle">Catppuccinify - 4 Soothing Flavors</text>
  <text x="600.0" y="88" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Seamless dynamic switching across all official Catppuccin colorways</text>

  <!-- 4 Columns Showcase -->
  <!-- 1. Mocha -->
  <g transform="translate(40, 120)">
    <rect width="260" height="520" rx="16" fill="#1E1E2E" filter="url(#cardShadow)"/>
    <rect width="260" height="70" rx="16" fill="#181825"/>
    <rect y="50" width="260" height="20" fill="#181825"/>
    <circle cx="30" cy="35" r="8" fill="#CBA6F7"/>
    <text x="50" y="40" fill="#CDD6F4" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Mocha</text>
    <text x="30" y="105" fill="#A6ADC8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DARKEST • DEFAULT</text>

    <!-- Mini UI Mockup -->
    <rect x="20" y="125" width="220" height="120" rx="12" fill="#313244"/>
    <circle cx="50" cy="160" r="16" fill="#CBA6F7"/>
    <rect x="80" y="150" width="130" height="10" rx="5" fill="#CDD6F4"/>
    <rect x="80" y="168" width="90" height="8" rx="4" fill="#A6ADC8"/>
    <rect x="20" y="200" width="220" height="4" rx="2" fill="#45475A"/>
    <rect x="20" y="200" width="140" height="4" rx="2" fill="#CBA6F7"/>

    <!-- Swatches -->
    <text x="20" y="275" fill="#CDD6F4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Palette Swatches</text>
    <g transform="translate(20, 290)">
      <circle cx="15" cy="15" r="12" fill="#F5E0DC"/>
      <circle cx="45" cy="15" r="12" fill="#F5C2E7"/>
      <circle cx="75" cy="15" r="12" fill="#CBA6F7"/>
      <circle cx="105" cy="15" r="12" fill="#F38BA8"/>
      <circle cx="135" cy="15" r="12" fill="#FAB387"/>
      <circle cx="165" cy="15" r="12" fill="#A6E3A1"/>
      <circle cx="195" cy="15" r="12" fill="#89B4FA"/>
    </g>

    <!-- Code pill -->
    <rect x="20" y="445" width="220" height="42" rx="8" fill="#11111B"/>
    <text x="32" y="471" fill="#CBA6F7" font-family="monospace" font-size="12">color_scheme mocha</text>
  </g>

  <!-- 2. Macchiato -->
  <g transform="translate(325, 120)">
    <rect width="260" height="520" rx="16" fill="#24273A" filter="url(#cardShadow)"/>
    <rect width="260" height="70" rx="16" fill="#1E2030"/>
    <rect y="50" width="260" height="20" fill="#1E2030"/>
    <circle cx="30" cy="35" r="8" fill="#C6A0F6"/>
    <text x="50" y="40" fill="#CAD3F5" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Macchiato</text>
    <text x="30" y="105" fill="#A5ADCB" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MEDIUM DARK</text>

    <!-- Mini UI Mockup -->
    <rect x="20" y="125" width="220" height="120" rx="12" fill="#363A4F"/>
    <circle cx="50" cy="160" r="16" fill="#C6A0F6"/>
    <rect x="80" y="150" width="130" height="10" rx="5" fill="#CAD3F5"/>
    <rect x="80" y="168" width="90" height="8" rx="4" fill="#A5ADCB"/>
    <rect x="20" y="200" width="220" height="4" rx="2" fill="#494D64"/>
    <rect x="20" y="200" width="140" height="4" rx="2" fill="#C6A0F6"/>

    <!-- Swatches -->
    <text x="20" y="275" fill="#CAD3F5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Palette Swatches</text>
    <g transform="translate(20, 290)">
      <circle cx="15" cy="15" r="12" fill="#F4DBD6"/>
      <circle cx="45" cy="15" r="12" fill="#F5BDE6"/>
      <circle cx="75" cy="15" r="12" fill="#C6A0F6"/>
      <circle cx="105" cy="15" r="12" fill="#ED8796"/>
      <circle cx="135" cy="15" r="12" fill="#F5A97F"/>
      <circle cx="165" cy="15" r="12" fill="#A6DA95"/>
      <circle cx="195" cy="15" r="12" fill="#8AADF4"/>
    </g>

    <!-- Code pill -->
    <rect x="20" y="445" width="220" height="42" rx="8" fill="#181926"/>
    <text x="32" y="471" fill="#C6A0F6" font-family="monospace" font-size="12">color_scheme macchiato</text>
  </g>

  <!-- 3. Frappe -->
  <g transform="translate(610, 120)">
    <rect width="260" height="520" rx="16" fill="#303446" filter="url(#cardShadow)"/>
    <rect width="260" height="70" rx="16" fill="#292C3C"/>
    <rect y="50" width="260" height="20" fill="#292C3C"/>
    <circle cx="30" cy="35" r="8" fill="#CA9EE6"/>
    <text x="50" y="40" fill="#C6D0F5" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Frappé</text>
    <text x="30" y="105" fill="#A5ADCE" font-family="system-ui, sans-serif" font-size="12" font-weight="600">LOW CONTRAST DARK</text>

    <!-- Mini UI Mockup -->
    <rect x="20" y="125" width="220" height="120" rx="12" fill="#414559"/>
    <circle cx="50" cy="160" r="16" fill="#CA9EE6"/>
    <rect x="80" y="150" width="130" height="10" rx="5" fill="#C6D0F5"/>
    <rect x="80" y="168" width="90" height="8" rx="4" fill="#A5ADCE"/>
    <rect x="20" y="200" width="220" height="4" rx="2" fill="#51576D"/>
    <rect x="20" y="200" width="140" height="4" rx="2" fill="#CA9EE6"/>

    <!-- Swatches -->
    <text x="20" y="275" fill="#C6D0F5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Palette Swatches</text>
    <g transform="translate(20, 290)">
      <circle cx="15" cy="15" r="12" fill="#F2D5CF"/>
      <circle cx="45" cy="15" r="12" fill="#F4B8E4"/>
      <circle cx="75" cy="15" r="12" fill="#CA9EE6"/>
      <circle cx="105" cy="15" r="12" fill="#E78284"/>
      <circle cx="135" cy="15" r="12" fill="#EF9F76"/>
      <circle cx="165" cy="15" r="12" fill="#A6D189"/>
      <circle cx="195" cy="15" r="12" fill="#8CAAEE"/>
    </g>

    <!-- Code pill -->
    <rect x="20" y="445" width="220" height="42" rx="8" fill="#232634"/>
    <text x="32" y="471" fill="#CA9EE6" font-family="monospace" font-size="12">color_scheme frappe</text>
  </g>

  <!-- 4. Latte -->
  <g transform="translate(895, 120)">
    <rect width="260" height="520" rx="16" fill="#EFF1F5" filter="url(#cardShadow)"/>
    <rect width="260" height="70" rx="16" fill="#E6E9EF"/>
    <rect y="50" width="260" height="20" fill="#E6E9EF"/>
    <circle cx="30" cy="35" r="8" fill="#8839EF"/>
    <text x="50" y="40" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Latte</text>
    <text x="30" y="105" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="12" font-weight="600">OFFICIAL LIGHT THEME</text>

    <!-- Mini UI Mockup -->
    <rect x="20" y="125" width="220" height="120" rx="12" fill="#CCD0DA"/>
    <circle cx="50" cy="160" r="16" fill="#8839EF"/>
    <rect x="80" y="150" width="130" height="10" rx="5" fill="#4C4F69"/>
    <rect x="80" y="168" width="90" height="8" rx="4" fill="#6C6F85"/>
    <rect x="20" y="200" width="220" height="4" rx="2" fill="#BCC0CC"/>
    <rect x="20" y="200" width="140" height="4" rx="2" fill="#8839EF"/>

    <!-- Swatches -->
    <text x="20" y="275" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Palette Swatches</text>
    <g transform="translate(20, 290)">
      <circle cx="15" cy="15" r="12" fill="#DC8A78"/>
      <circle cx="45" cy="15" r="12" fill="#EA76CB"/>
      <circle cx="75" cy="15" r="12" fill="#8839EF"/>
      <circle cx="105" cy="15" r="12" fill="#D20F39"/>
      <circle cx="135" cy="15" r="12" fill="#FE640B"/>
      <circle cx="165" cy="15" r="12" fill="#40A02B"/>
      <circle cx="195" cy="15" r="12" fill="#1E66F5"/>
    </g>

    <!-- Code pill -->
    <rect x="20" y="445" width="220" height="42" rx="8" fill="#DCE0E8"/>
    <text x="32" y="471" fill="#8839EF" font-family="monospace" font-size="12">color_scheme latte</text>
  </g>
</svg>