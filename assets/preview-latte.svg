<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8839EF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E66F5" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E66F5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#40A02B" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE640B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8839EF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Window Background -->
  <rect width="1200" height="680" rx="16" fill="#EFF1F5"/>

  <!-- Window Header / Titlebar -->
