  <text x="68" y="546" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Flavor: Latte</text>

  <!-- Main View Area -->
  <rect x="272" y="60" width="912" height="520" rx="16" fill="#E6E9EF"/>

