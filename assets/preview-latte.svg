  <text x="42" y="272" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🎵 Lofi Beats 2026</text>
  <text x="42" y="304" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚡ Coding Synthwave</text>
  <text x="42" y="336" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13" font-weight="500">☕ Coffee &amp; Jazz</text>
  <text x="42" y="368" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🌌 Ambient Dreams</text>

