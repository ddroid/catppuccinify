  <rect x="42" y="88" width="16" height="16" rx="4" fill="#8839EF"/>
  <text x="70" y="101" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Home</text>

  <rect x="42" y="132" width="16" height="16" rx="4" fill="#6C6F85"/>
  <text x="70" y="145" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Search</text>

