  <rect x="312" y="100" width="110" height="110" rx="12" fill="url(#cardGrad1)"/>
  <text x="444" y="125" fill="#8839EF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PLAYLIST</text>
  <text x="444" y="165" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="32" font-weight="800">Catppuccinify Latte</text>
  <text x="444" y="195" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="14">Official Latte palette with rounded glassmorphism &amp; dynamic switching • 120 songs, 6 hr 42 min</text>

