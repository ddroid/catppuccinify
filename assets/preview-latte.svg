  <text x="292" y="265" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Made For You</text>
  <text x="1100" y="265" fill="#8839EF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end">Show all</text>

  <!-- Content Cards Grid -->
  <!-- Card 1 -->
  <rect x="292" y="285" width="200" height="260" rx="12" fill="#CCD0DA"/>
  <rect x="307" y="300" width="170" height="160" rx="10" fill="url(#cardGrad1)"/>
  <!-- Floating play button -->
  <circle cx="452" cy="435" r="22" fill="#8839EF" filter="url(#shadow)"/>
  <polygon points="447,425 463,435 447,445" fill="#DCE0E8"/>
  <text x="307" y="490" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Daily Mix 1</text>
  <text x="307" y="512" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13">Lo-fi beats, chill hop</text>

  <!-- Card 2 -->
  <rect x="516" y="285" width="200" height="260" rx="12" fill="#CCD0DA"/>
  <rect x="531" y="300" width="170" height="160" rx="10" fill="url(#cardGrad2)"/>
  <text x="531" y="490" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Deep Focus</text>
  <text x="531" y="512" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13">Ambient &amp; electronic</text>

  <!-- Card 3 -->
  <rect x="740" y="285" width="200" height="260" rx="12" fill="#CCD0DA"/>
  <rect x="755" y="300" width="170" height="160" rx="10" fill="url(#cardGrad3)"/>
  <text x="755" y="490" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Synthwave City</text>
  <text x="755" y="512" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13">Retro futuristic drives</text>

  <!-- Card 4 -->
  <rect x="964" y="285" width="200" height="260" rx="12" fill="#CCD0DA"/>
  <rect x="979" y="300" width="170" height="160" rx="10" fill="url(#cardGrad1)"/>
  <text x="979" y="490" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Acoustic Morning</text>
  <text x="979" y="512" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="13">Unplugged warm melodies</text>

  <!-- Now Playing Bar -->
  <rect x="16" y="595" width="1168" height="70" rx="14" fill="#DCE0E8" filter="url(#shadow)"/>

  <!-- Left: Track info -->
  <rect x="32" y="607" width="46" height="46" rx="8" fill="url(#cardGrad1)"/>
  <text x="90" y="626" fill="#4C4F69" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Resonance (Catppuccin Edit)</text>
  <text x="90" y="644" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="12">HOME • Odyssey</text>

  <!-- Center: Controls -->
  <!-- Prev -->
  <polygon points="560,622 550,630 560,638" fill="#6C6F85"/>
  <line x1="548" y1="622" x2="548" y2="638" stroke="#6C6F85" stroke-width="2"/>
  <!-- Play/Pause -->
  <circle cx="600" cy="630" r="18" fill="#8839EF"/>
  <polygon points="596,623 607,630 596,637" fill="#DCE0E8"/>
  <!-- Next -->
  <polygon points="640,622 650,630 640,638" fill="#6C6F85"/>
  <line x1="652" y1="622" x2="652" y2="638" stroke="#6C6F85" stroke-width="2"/>

  <!-- Progress Bar -->
  <text x="440" y="658" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">2:14</text>
  <rect x="450" y="654" width="300" height="4" rx="2" fill="#BCC0CC"/>
  <rect x="450" y="654" width="165" height="4" rx="2" fill="#8839EF"/>
  <circle cx="615" cy="656" r="5" fill="#4C4F69"/>
  <text x="760" y="658" fill="#6C6F85" font-family="system-ui, sans-serif" font-size="10">3:32</text>

  <!-- Right: Volume & extras -->
  <rect x="1040" y="628" width="80" height="4" rx="2" fill="#BCC0CC"/>
  <rect x="1040" y="628" width="55" height="4" rx="2" fill="#1E66F5"/>
  <circle cx="1095" cy="630" r="4" fill="#4C4F69"/>
  <path d="M1130 626 L1134 626 L1138 622 L1138 638 L1134 634 L1130 634 Z" fill="#6C6F85"/>
