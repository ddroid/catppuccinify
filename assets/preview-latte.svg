  <text x="600.0" y="30" fill="#6C6F85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Spotify - Catppuccinify (Latte Flavor)</text>

  <!-- Sidebar -->
  <rect x="16" y="60" width="240" height="520" rx="16" fill="#E6E9EF"/>
