; Matugen template for Catppuccinify's "System (color.ini / DMS)" scheme.
; Used by DankMaterialShell (or plain matugen) to generate a Spicetify color.ini
; from your wallpaper / DMS theme. See README → "DankMaterialShell / Matugen".
[Dank]
text               = {{colors.on_surface.default.hex_stripped}}
subtext            = {{colors.on_surface_variant.default.hex_stripped}}
main               = {{colors.surface.default.hex_stripped}}
main-elevated      = {{colors.surface_container_high.default.hex_stripped}}
sidebar            = {{colors.surface_container_low.default.hex_stripped}}
player             = {{colors.surface_container.default.hex_stripped}}
card               = {{colors.surface_container_high.default.hex_stripped}}
shadow             = {{colors.shadow.default.hex_stripped}}
highlight          = {{colors.surface_container_highest.default.hex_stripped}}
highlight-elevated = {{colors.surface_container_highest.default.hex_stripped}}
selected-row       = {{colors.on_surface_variant.default.hex_stripped}}
button             = {{colors.primary.default.hex_stripped}}
button-active      = {{colors.primary_fixed_dim.default.hex_stripped}}
button-disabled    = {{colors.outline_variant.default.hex_stripped}}
tab-active         = {{colors.secondary_container.default.hex_stripped}}
notification       = {{colors.primary.default.hex_stripped}}
notification-error = {{colors.error.default.hex_stripped}}
equalizer          = {{colors.primary.default.hex_stripped}}
misc               = {{colors.outline.default.hex_stripped}}
; extra accents the cover-art accent snapping can choose from
accent-1           = {{colors.primary.default.hex_stripped}}
accent-2           = {{colors.secondary.default.hex_stripped}}
accent-3           = {{colors.tertiary.default.hex_stripped}}
accent-4           = {{colors.primary_fixed_dim.default.hex_stripped}}
accent-5           = {{colors.secondary_fixed_dim.default.hex_stripped}}
accent-6           = {{colors.tertiary_fixed_dim.default.hex_stripped}}
